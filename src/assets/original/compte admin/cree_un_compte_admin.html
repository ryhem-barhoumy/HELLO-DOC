<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un Compte Médecin</title>
  <link rel="stylesheet" href="admin.css">
  <script src="../db.js"></script>
</head>
<body class="page-create-admin">
  <div class="form-container">
    <h2>Créer un Compte Médecin</h2>
    <form id="createPrestataireAccountForm" autocomplete="off" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="prestataireFullName" class="required">Nom Complet</label>
        <input autocomplete="off" type="text" id="prestataireFullName" placeholder="Votre nom complet" required>
      </div>
      <div class="form-group">
        <label for="prestataireEmail" class="required">Email</label>
        <input autocomplete="off" type="email" id="prestataireEmail" placeholder="Votre adresse email" required>
      </div>
      <div class="form-group">
        <label for="prestatairePassword" class="required">Mot de Passe</label>
        <input autocomplete="off" type="password" id="prestatairePassword" placeholder="Votre mot de passe" required>
      </div>
      <div class="form-group">
        <label for="prestatairePasswordConfirm" class="required">Confirmer le Mot de Passe</label>
        <input autocomplete="off" type="password" id="prestatairePasswordConfirm" placeholder="Confirmez votre mot de passe" required>
      </div>
      <div class="form-group">
        <label for="prestatairePhone" class="required">Numéro de Téléphone</label>
        <input autocomplete="off" type="tel" id="prestatairePhone" placeholder="Votre numéro de téléphone" required>
      </div>
      <div class="form-group">
        <label for="prestataireProfilePic" class="required">Image de la prestation</label>
        <input autocomplete="off" type="file" id="prestataireProfilePic" accept="image/*" required>
      </div>
      <div class="form-group">
        <label for="prestataireSpecialty" class="required">Spécialité médicale</label>
        <select autocomplete="off" id="prestataireSpecialty" required>
          <option value="">Choisir une spécialité</option>
          <option value="Médecin généraliste">Médecin généraliste</option>
          <option value="Dentiste / Orthodontiste">Dentiste / Orthodontiste</option>
          <option value="Ophtalmologue">Ophtalmologue</option>
          <option value="Gynécologue">Gynécologue</option>
          <option value="Pédiatre">Pédiatre</option>
          <option value="ORL">ORL</option>
          <option value="Dermatologue">Dermatologue</option>
          <option value="Neurologue">Neurologue</option>
          <option value="Cardiologue">Cardiologue</option>
        </select>
      </div>
      <div class="form-group">
        <label for="serviceTitle" class="required">Nom affiché dans Nos prestations</label>
        <input autocomplete="off" type="text" id="serviceTitle" placeholder="Ex: Dr. Sami / Cabinet X" required>
      </div>
      <div class="form-group">
        <label for="serviceDuration" class="required">Durée fixe du rendez-vous (minutes)</label>
        <input autocomplete="off" type="number" id="serviceDuration" placeholder="Ex: 45" min="5" step="5" required>
      </div>
      <div class="form-group">
        <label for="workStart" class="required">Heure de début de travail</label>
        <input autocomplete="off" type="time" id="workStart" value="08:00" required>
      </div>
      <div class="form-group">
        <label for="workEnd" class="required">Heure de fin de travail</label>
        <input autocomplete="off" type="time" id="workEnd" value="17:00" required>
      </div>
      <div class="form-group full">
        <label class="required">Jours de travail</label>
        <div class="days-grid">
          <label class="day-check"><input autocomplete="off" type="checkbox" name="workingDays" value="1" checked> Lundi</label>
          <label class="day-check"><input autocomplete="off" type="checkbox" name="workingDays" value="2" checked> Mardi</label>
          <label class="day-check"><input autocomplete="off" type="checkbox" name="workingDays" value="3" checked> Mercredi</label>
          <label class="day-check"><input autocomplete="off" type="checkbox" name="workingDays" value="4" checked> Jeudi</label>
          <label class="day-check"><input autocomplete="off" type="checkbox" name="workingDays" value="5" checked> Vendredi</label>
          <label class="day-check"><input autocomplete="off" type="checkbox" name="workingDays" value="6" checked> Samedi</label>
          <label class="day-check"><input autocomplete="off" type="checkbox" name="workingDays" value="0"> Dimanche</label>
        </div>
      </div>
      <div class="form-group">
        <label for="pauseMinutes" class="required">Pause entre les rendez-vous (minutes)</label>
        <input autocomplete="off" type="number" id="pauseMinutes" placeholder="Ex: 15" value="0" min="0" step="5" required>
      </div>
      <div class="form-group">
        <label for="serviceLocation" class="required">Lieu</label>
        <input autocomplete="off" type="text" id="serviceLocation" placeholder="Adresse du cabinet / centre" required>
      </div>
      <div class="form-group full">
        <label class="required">Services et tarifs</label>
        <div class="services-editor">
          <div class="service-line">
            <div>
              <label for="serviceName">Service</label>
              <input autocomplete="off" type="text" id="serviceName" placeholder="Ex: Consultation dentaire">
            </div>
            <div>
              <label for="servicePrice">Tarif</label>
              <input autocomplete="off" type="number" id="servicePrice" placeholder="Ex: 50" min="0" step="1" inputmode="numeric">
            </div>
            <button type="button" class="service-add-btn" onclick="addMedicalService()">Ajouter</button>
          </div>
          <p class="hint">Ajoutez au moins un service. Le client choisira ce service pendant la réservation.</p>
          <ul class="service-list" id="servicesList"></ul>
        </div>
      </div>
      <div class="form-group full">
        <label for="prestataireDescription" class="required">Description de la prestation</label>
        <textarea autocomplete="off" id="prestataireDescription" placeholder="Décrivez clairement la prestation" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn-submit">Créer le Compte</button>
      <p class="login-link">Déjà un compte ? <a href="../interface.html">Se connecter</a></p>
    </form>
  </div>
<script>

  window.addEventListener('DOMContentLoaded', () => {
    const clearIds = [
      'prestataireFullName','prestataireEmail','prestatairePassword','prestatairePasswordConfirm',
      'prestatairePhone','serviceTitle','serviceLocation','serviceName','servicePrice','prestataireDescription'
    ];
    setTimeout(() => {
      clearIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      const file = document.getElementById('prestataireProfilePic');
      if (file) file.value = '';
    }, 80);
  });

  const medicalServices = [];

  function parseMedicalServiceInput(text){
    return String(text || '').replace(/\n+/g, ' / ').split(/\s*[\/;]\s*/).map(part => {
      const m = part.trim().match(/^(.+?)\s*[:：]\s*(.+)$/);
      if(!m) return null;
      const normalizedPrice = normalizePrice(m[2].trim());
      return normalizedPrice ? { name: m[1].trim(), price: normalizedPrice } : null;
    }).filter(Boolean);
  }

  function normalizePrice(value){
    const raw = String(value || '').trim().replace(/\s*DT$/i, '').replace(',', '.');
    if(!raw || !/^\d+(\.\d+)?$/.test(raw)) return null;
    const amount = Number(raw);
    if(!Number.isFinite(amount) || amount < 0) return null;
    return (Number.isInteger(amount) ? String(amount) : String(amount).replace(/\.0+$/, '')) + ' DT';
  }

  function renderMedicalServices(){
    servicesList.innerHTML = medicalServices.map((s,index) => `
      <li>
        <span>${s.name} — ${s.price}</span>
        <button type="button" class="btn-danger" onclick="removeMedicalService(${index})">Supprimer</button>
      </li>
    `).join('');
  }

  function addMedicalService(){
    const name = serviceName.value.trim();
    const price = servicePrice.value.trim();
    const parsedFromName = parseMedicalServiceInput(name);
    if(parsedFromName.length && !price){
      medicalServices.push(...parsedFromName);
    } else {
      const normalizedPrice = normalizePrice(price);
      if(!name || !normalizedPrice){
        alert('Ajoutez le nom du service et un tarif numérique valide. Exemple : 50');
        return;
      }
      medicalServices.push({name, price: normalizedPrice});
    }
    serviceName.value = '';
    servicePrice.value = '';
    renderMedicalServices();
  }

  function removeMedicalService(index){
    medicalServices.splice(index,1);
    renderMedicalServices();
  }

  function readImage(file) {
    return new Promise(resolve => {
      if (!file) return resolve('medical.png');
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve('medical.png');
      reader.readAsDataURL(file);
    });
  }

  async function handleFormSubmit(event) {
    event.preventDefault();

    const fullName = prestataireFullName.value.trim();
    const email = prestataireEmail.value.trim();
    const password = prestatairePassword.value;
    const passwordConfirm = prestatairePasswordConfirm.value;
    const phone = prestatairePhone.value.trim();
    const category = 'Médecin';
    const specialty = prestataireSpecialty.value;
    const serviceType = 'Consultation médicale';
    const titleValue = document.getElementById('serviceTitle').value.trim();
    const duration = document.getElementById('serviceDuration').value.trim();
    const startValue = document.getElementById('workStart').value;
    const endValue = document.getElementById('workEnd').value;
    const workingDays = Array.from(document.querySelectorAll('input[name="workingDays"]:checked')).map(input => input.value);
    const pauseValue = document.getElementById('pauseMinutes').value.trim();
    const location = serviceLocation.value.trim();
    const description = prestataireDescription.value.trim();
    const image = await readImage(prestataireProfilePic.files[0]);

    if(password !== passwordConfirm) return alert('Les mots de passe ne correspondent pas !');
    if(endValue <= startValue) return alert('L’heure de fin doit être supérieure à l’heure de début.');
    if(workingDays.length === 0) return alert('Choisissez au moins un jour de travail.');
    if(medicalServices.length === 0) return alert('Ajoutez au moins un service avec son tarif.');

    try {
      const prestataire = RVDB.addAdmin({
        fullName,email,password,phone,category,specialty,serviceType,serviceTitle: titleValue,
        duration: duration + ' minutes',durationMinutes: duration,workStart: startValue,workEnd: endValue,workingDays,
        pauseMinutes: pauseValue,location,serviceLocation: location,address: location,
        services: medicalServices,price: medicalServices.map(s => s.name + ': ' + s.price).join(' / '),
        description,image
      });
      RVDB.setCurrentUser('admin', prestataire);
      window.location.href = 'admin.html';
    } catch (e) {
      alert(e.message);
    }
  }
</script>
</body>
</html>
