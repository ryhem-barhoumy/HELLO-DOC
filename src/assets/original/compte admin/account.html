<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="page-simple-account">

<div class="account-container">
    <h2>Compte Admin</h2>
    
    <!-- Affichage des données du compte -->
    <div id="accountDetails"></div>

    <!-- Bouton pour modifier le compte -->
    <button onclick="goBack()">Modifier le Compte</button>
</div>

<script>
    
    // Fonction pour récupérer les données du compte depuis le localStorage
    const userData = JSON.parse(localStorage.getItem('adminAccount'));

    if (userData) {
        // Afficher les informations du compte
        const accountDetails = document.getElementById('accountDetails');
        const profilePic = userData.profilePic ? `<img src="${URL.createObjectURL(new Blob([userData.profilePic]))}" alt="Photo de Profil" class="profile-pic" />` : '';
        
        accountDetails.innerHTML = `
            ${profilePic}
            <p><strong>Nom Complet:</strong> ${userData.fullName}</p>
            <p><strong>Email:</strong> ${userData.email}</p>
            <p><strong>Numéro de Téléphone:</strong> ${userData.phone}</p>
            <p><strong>Spécialité:</strong> ${userData.specialty}</p>
            <p><strong>Description:</strong> ${userData.description}</p>
            <p><strong>Facebook:</strong> ${userData.facebook || 'Non renseigné'}</p>
            <p><strong>Twitter:</strong> ${userData.twitter || 'Non renseigné'}</p>
            <p><strong>LinkedIn:</strong> ${userData.linkedin || 'Non renseigné'}</p>
        `;
    } else {
        // Si aucune donnée n'est trouvée, rediriger vers la page de création
        alert("Aucun compte trouvé !");
        window.location.href = 'form.html';
    }

    function goBack() {
        // Rediriger l'utilisateur vers le formulaire pour modifier les informations
        window.location.href = 'cree_un_compte_admin.html';
    }
</script>

</body>
</html>
