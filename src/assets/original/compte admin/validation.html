<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demandes en attente</title>
  <link rel="stylesheet" href="admin.css">
  <script src="../db.js"></script>
</head>
<body class="page-validation">
    <aside class="sidebar">
    <h2>Espace Prestataire</h2>
    <p class="doctor-name" id="adminSideName">Admin</p>
    <a href="admin.html">▣ Tableau de bord</a>
    <a href="disponibilites.html">◷ Disponibilités</a>
    <a href="patients.html">👥 Patients enregistrés</a>
    <a href="validation.html" class="active">✓ En attente de validation</a>
    <a href="avis-patients.html">★ Avis des patients</a>
    <a href="parametre.html">⚙ Paramètres</a>
    <a href="#" onclick="return logoutAdmin()">↪ Se déconnecter</a>
  </aside>
  <main class="content">
    <div class="page-header"><h1>En attente de validation</h1></div>
    <section class="section list-card">
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Patient</th><th>Date</th><th>Heure</th><th>Service</th><th>Actions</th></tr></thead><tbody id="pendingList"></tbody></table></div>
    </section>
  </main>
<script>
const currentUser = RVDB.getCurrentUser();
if (!currentUser || currentUser.role !== 'admin') { alert('Veuillez vous connecter comme admin.'); window.location.href = '../interface.html'; }
document.getElementById('adminSideName').textContent = currentUser.serviceTitle || currentUser.fullName || 'Admin';
function safe(v){ return String(v || 'Non renseigné').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function q(v){ return '&quot;' + v + '&quot;'; }
function displayService(r){ let v = r.selectedService || r.service || 'Prestation'; if(String(v).includes(' - ')) v = String(v).split(' - ').pop().trim(); return v; }
function showDetails(id){ window.location.href='rdv-details.html?id='+encodeURIComponent(id); }
function confirmRdv(id){ RVDB.updateAppointment(id,{status:'Confirmé'}); renderPending(); }
function rejectRdv(id){ RVDB.cancelAppointment(id); renderPending(); }
function renderPending(){
  const db=RVDB.loadDb();
  const rows=db.appointments.filter(x=>x.adminId===currentUser.id && x.status==='En attente').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  document.getElementById('pendingList').innerHTML = rows.length ? rows.map((r,i)=>`<tr><td>${i+1}</td><td>${safe(r.patient)}</td><td>${safe(r.date)}</td><td>${safe(r.time)}</td><td>${safe(displayService(r))}</td><td><div class="actions"><button class="btn btn-outline" onclick="showDetails(${q(r.id)})">Détails</button><button class="btn btn-success" onclick="confirmRdv(${q(r.id)})">Confirmer</button><button class="btn btn-danger" onclick="rejectRdv(${q(r.id)})">Refuser</button></div></td></tr>`).join('') : '<tr><td colspan="6"><div class="empty">Aucune demande en attente.</div></td></tr>';
}
function logoutAdmin(){ if(confirm('Êtes-vous sûr de vouloir vous déconnecter ?')){ RVDB.logout(); window.location.href='../interface.html'; } return false; }
renderPending();
</script>
</body>
</html>
