<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail prestation</title>
    <script src="../db.js"></script>
    <script src="client-common.js"></script>
    <link rel="stylesheet" href="client.css">
</head>

<body class="page-detail">
    <main class="page">
        <section class="top">
            <span class="tag" id="typeTag"></span>
            <h1 id="title"></h1>
            
        </section>
        <section class="detail">
            <div class="image-card">
                <img id="img" src="medical.png" alt="Prestation">
            </div>
            <div class="info-card">
                <h2 id="name"></h2>
                <p class="desc" id="desc"></p>
                <div class="info-grid">
                    <div class="box">
                        <h4>Durée estimée</h4>
                        <p id="duration"></p>
                    </div>
                    <div class="box">
                        <h4>Jours disponibles</h4>
                        <p id="availability"></p>
                    </div>
                    <div class="box">
                        <h4>Lieu</h4>
                        <p id="locationText"></p>
                    </div>
                    <div class="box">
                        <h4>Téléphone</h4>
                        <p id="phoneText"></p>
                    </div>
                </div>
                <div class="price">
                    <strong>Services et tarifs</strong>
                    <ul class="services-list" id="servicesList"></ul>
                </div>
                <div class="buttons">
                    <a class="btn primary" id="reserveBtn">Réserver maintenant</a>
                    <a class="btn secondary" href="prestations.html">Retour</a>
                </div>
            </div>
        </section>
    </main>
    <script>
        function workingDaysText(a) {
            const names = { '0': 'Dimanche', '1': 'Lundi', '2': 'Mardi', '3': 'Mercredi', '4': 'Jeudi', '5': 'Vendredi', '6': 'Samedi' };
            const days = (a.workingDays && a.workingDays.length ? a.workingDays : ['1', '2', '3', '4', '5', '6'])
                .map(String); return days
                    .map(d => names[d])
                    .filter(Boolean)
                    .join(', ');
        }
        function safe(v) { return String(v || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

        const params = new URLSearchParams(location.search);
        const adminId = params.get('adminId');
        const db = RVDB.loadDb();
        const a = db.admins.find(x => x.id === adminId && x.id !== 'admin_default' && x.email !== 'admin' && x.serviceTitle !== 'Dr. Ahmed Ben Ali');
        if (!a) {
            alert('Prestation introuvable.'); location.href = 'prestations.html';
        }
        const services = RVDB.normalizeServices ? RVDB.normalizeServices(a) : (Array.isArray(a.services) ? a.services : [{ name: 'Consultation', price: a.price || 'Sur demande' }]);
        typeTag.textContent = a.specialty || 'Médecin';
        title.textContent = a.serviceTitle || a.fullName || 'Médecin';
        name.textContent = a.serviceTitle || a.fullName || 'Médecin';
        img.src = a.image || a.profileImage || 'medical.png';
        desc.textContent = a.description || 'Prestation médicale disponible avec réservation en ligne.';
       
        duration.textContent = a.duration || ((a.durationMinutes || 30) + ' minutes');
        availability.textContent = workingDaysText(a);
        locationText.textContent = a.location || a.serviceLocation || a.address || 'Non précisé';
        phoneText.textContent = a.phone || 'Non précisé';
        servicesList.innerHTML = services.map(s => `<li><span>${safe(s.name)}</span><strong>${safe(s.price)}</strong></li>`).join('');
        reserveBtn.href = 'reservation.html?adminId=' + encodeURIComponent(a.id);
    </script>
</body>

</html>
