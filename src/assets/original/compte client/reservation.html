<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation</title>
    <link rel="stylesheet" href="client.css">
    <script src="../db.js"></script>
    <script src="client-common.js"></script>
    
</head>

<body class="page-reservation">
    <section class="page-title">
        <h2>Réserver un rendez-vous</h2>
        <div class="line"></div>
    </section>
    <section class="form-container">
        <div class="form-card"><span class="service-pill" id="servicePill"></span>
            <h3>Formulaire de réservation</h3>
            <p class="subtitle" id="subText"></p>
            <form id="reservationForm">
                <div class="form-row">
                    <div class="form-group"><label class="required">Nom complet</label><input id="name" required></div>
                    <div class="form-group"><label class="required">Téléphone</label><input id="phone" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="required">Email</label><input id="email" type="email"
                            required></div>
                    <div class="form-group"><label class="required">Adresse</label><input id="adresse" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="required">Service</label><select id="medicalService"
                            required></select></div>
                    <div class="form-group"><label>Tarif</label>
                        <div class="price-box" id="selectedPrice">Sélectionnez un service</div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="required">Date</label><input type="date" id="date" required>
                    </div>
                    <div class="form-group" id="slotGroup"><label class="required" id="timeLabel">Heure
                            disponible</label><select id="time" required></select><span class="time-note"
                            id="slotNote"></span></div>
                </div>
                <div class="form-group"><label>Informations supplémentaires</label><textarea id="notes"></textarea>
                </div><button class="submit-btn" type="submit">Confirmer la réservation</button>
            </form>
        </div>
    </section>
    <script>
        const currentUser = RVDB.getCurrentUser(); if (!currentUser || currentUser.role !== 'client') { location.href = '../interface.html'; }
        const params = new URLSearchParams(location.search); 
        const adminId = params.get('adminId');
        const requestedDate = params.get('date') || '';
        const controlFor = params.get('controlFor') || ''; 
        const dbInit = RVDB.loadDb(); 
        const admin = adminId ? dbInit.admins.find(a => a.id === adminId) : null; 
        if (!admin) { 
            alert('Médecin introuvable.'); 
            location.href = 'prestations.html'; 
        }
        const services = RVDB.normalizeServices ? RVDB.normalizeServices(admin) : (Array.isArray(admin.services) ? admin.services : [{ name: 'Consultation', price: admin.price || 'Sur demande' }]); 
        const service = { title: admin.serviceTitle || admin.fullName || 'Médecin', type: admin.specialty || 'Médecin' }; 
        servicePill.textContent = service.type + ' - ' + service.title;
        const dateInput = document.getElementById('date');
        const timeSelect = document.getElementById('time');
        const slotNoteEl = document.getElementById('slotNote');
        const serviceSelect = document.getElementById('medicalService');
        const priceBox = document.getElementById('selectedPrice');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const emailInput = document.getElementById('email');
        const adresseInput = document.getElementById('adresse');
        const notesInput = document.getElementById('notes');
        services.forEach((s, i) => { 
            const o = document.createElement('option'); 
            o.value = String(i); 
            o.textContent = s.name; 
            serviceSelect.appendChild(o); 
        });
        function updatePrice() { 
            const s = services[Number(serviceSelect.value) || 0]; 
            priceBox.textContent = s ? s.price : 'Sélectionnez un service'; 
        } 
        serviceSelect.addEventListener('change', updatePrice); updatePrice();
        const today = RVDB.today(); 
        dateInput.value = (requestedDate && requestedDate >= today) ? requestedDate : today; 
        dateInput.min = today; 
        if(controlFor && requestedDate){
            subText.textContent = 'Contrôle recommandé : choisissez un créneau disponible pour le ' + requestedDate + '.';
        }
        const client = dbInit.clients.find(c => c.id === currentUser.id); 
        if (client) { nameInput.value = client.fullName || ''; 
        emailInput.value = client.email || ''; 
        phoneInput.value = client.phone || ''; 
        adresseInput.value = client.address || ''; 
    }
        function isPastTime(t) { if (!t) return false; const now = new Date(); const [h, m] = t.split(':').map(Number); return h * 60 + m <= now.getHours() * 60 + now.getMinutes(); }
        function adminWorksOnDate(dateValue) { const db = RVDB.loadDb(); const a = db.admins.find(x => x.id === adminId); const days = (a && a.workingDays && a.workingDays.length ? a.workingDays : ['1', '2', '3', '4', '5', '6']).map(String); return days.includes(String(new Date(dateValue + 'T00:00:00').getDay())); }
        function getAbsenceForDate(dateValue) { const db = RVDB.loadDb(); return (db.absences || []).find(a => a.adminId === adminId && a.status !== 'Supprimée' && a.startDate <= dateValue && dateValue <= a.endDate); }
        function refreshSlots() { const d = dateInput.value; const absence = getAbsenceForDate(d); if (absence) { timeSelect.innerHTML = '<option value="">Médecin absent</option>'; slotNoteEl.textContent = 'Le médecin est indisponible ce jour (' + absence.reason + '). Choisissez une autre date.'; return; } if (!adminWorksOnDate(d)) { timeSelect.innerHTML = '<option value="">Médecin indisponible ce jour</option>'; slotNoteEl.textContent = 'Ce médecin ne travaille pas ce jour. Choisissez un autre jour.'; return; } if (RVDB.generateSlotsForDate) { RVDB.generateSlotsForDate(adminId, d); } const db = RVDB.loadDb(); let slots = db.slots.filter(s => s.adminId === adminId && s.date === d && s.status === 'Disponible' && adminWorksOnDate(s.date)); slots = slots.filter(s => d > today ? true : (d < today ? false : !isPastTime(s.start))); slots.sort((a, b) => a.start.localeCompare(b.start)); timeSelect.innerHTML = slots.length ? '<option value="">Sélectionnez une heure</option>' : '<option value="">Aucun créneau disponible</option>'; slots.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.start + ' - ' + s.end; timeSelect.appendChild(o); }); slotNoteEl.textContent = slots.length ? slots.length + ' créneau(x) disponible(s)' : 'Aucun créneau disponible'; }
        dateInput.onchange = function () { if (this.value < today) { alert('Date invalide'); this.value = today; } refreshSlots(); }; refreshSlots();
        reservationForm.onsubmit = function (e) { e.preventDefault(); if (dateInput.value < today) return alert('Date invalide'); if (getAbsenceForDate(dateInput.value)) return alert('Le médecin est absent ce jour. Choisissez une autre date.'); if (!adminWorksOnDate(dateInput.value)) return alert('Ce médecin ne travaille pas ce jour. Choisissez un autre jour.'); if (!timeSelect.value) return alert('Choisissez un créneau'); const selected = services[Number(serviceSelect.value) || 0]; try { RVDB.createAppointment({ clientId: currentUser.id, patient: nameInput.value.trim(), phone: phoneInput.value.trim(), email: emailInput.value.trim(), address: adresseInput.value.trim(), service: (controlFor ? 'Contrôle' : selected.name), selectedService: (controlFor ? 'Contrôle' : selected.name), price: selected.price, notes: notesInput.value.trim(), slotId: timeSelect.value }); alert('Réservation ajoutée'); location.href = 'suivi.html'; } catch (err) { alert(err.message); refreshSlots(); } };
    </script>
</body>

</html>
