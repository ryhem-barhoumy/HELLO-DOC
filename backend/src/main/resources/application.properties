spring.application.name=hello-doc-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${HELLODOC_DB_URL:jdbc:mysql://localhost:3306/hello_doc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${HELLODOC_DB_USERNAME}
spring.datasource.password=${HELLODOC_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
hellodoc.frontend-origin=${HELLODOC_FRONTEND_ORIGIN:http://localhost:4200}
hellodoc.admin.email=admin@hellodoc.com
hellodoc.admin.initial-password=${HELLODOC_ADMIN_INITIAL_PASSWORD:}
