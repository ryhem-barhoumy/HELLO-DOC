spring.application.name=hello-doc-backend
server.port=${SERVER_PORT:8081}
hellodoc.booking.min-notice-minutes=${HELLODOC_MIN_BOOKING_NOTICE_MINUTES:60}
hellodoc.booking.max-horizon-days=${HELLODOC_MAX_BOOKING_HORIZON_DAYS:60}
spring.datasource.url=${HELLODOC_DB_URL}
spring.datasource.username=${HELLODOC_DB_USERNAME}
spring.datasource.password=${HELLODOC_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
hellodoc.frontend-origin=${HELLODOC_FRONTEND_ORIGIN:http://localhost:4200}
hellodoc.admin.email=admin@hellodoc.com
hellodoc.admin.initial-password=${HELLODOC_ADMIN_INITIAL_PASSWORD:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# Enable only after SMTP credentials are configured in the backend process environment.
hellodoc.email.enabled=${HELLODOC_EMAIL_ENABLED:false}
hellodoc.email.from=${HELLODOC_EMAIL_FROM:no-reply@hellodoc.tn}
hellodoc.frontend-url=${HELLODOC_FRONTEND_URL:http://localhost:4200}
spring.mail.host=${HELLODOC_SMTP_HOST:}
spring.mail.port=${HELLODOC_SMTP_PORT:587}
spring.mail.username=${HELLODOC_SMTP_USERNAME:}
spring.mail.password=${HELLODOC_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${HELLODOC_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${HELLODOC_SMTP_STARTTLS:true}
